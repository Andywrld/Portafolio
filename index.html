<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Andy Torres — Desarrollador Frontend y Líder Técnico. Arquitectura de interfaces web modernas con React, TypeScript y Next.js."
    />
    <meta name="theme-color" content="#fbfbfd" />
    <title>Andy Torres — Frontend & Líder Técnico</title>
    <!-- Resolve the theme before first paint so there is no light flash.
         Keep the key and colors in sync with src/hook/useTheme.ts. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('theme');
          theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
        } catch (error) {
          /* Storage blocked: fall back to light. */
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', theme === 'dark' ? '#0c0e14' : '#fbfbfd');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
